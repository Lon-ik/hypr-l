monitor=,preferred,auto,1
exec-once = awww-daemon
exec-once = awww
exec-once = nwg-dock-hyprland
exec-once = waybar
exec-once = dunst
exec-once = kitty --class term-clock -e tty-clock -s -c -B -C 6
exec-once = kitty --class term-cava -e cava
input {
    kb_layout = us,ru
    kb_options = grp:alt_shift_toggle
    follow_mouse = 1
    touchpad {
        natural_scroll = false
    }
    sensitivity = 0
}

general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    col.active_border = 0xff00ffcc 0xffaa00ff 45deg
    col.inactive_border = 0xff2d0057
    layout = dwindle
}

decoration {
    rounding = 10
	active_opacity = 0.9
	inactive_opacity = 0.85
    blur {
        enabled = true
        size = 3
        passes = 1
	new_optimizations = true
	xray = false
    }
}

animations {
    enabled = true
    bezier = myBezier, 0.05, 0.9, 0.1, 1.05
    animation = windows, 1, 7, myBezier
    animation = windowsOut, 1, 7, default, popin 80%
    animation = fade, 1, 7, default
    animation = workspaces, 1, 6, default
}

dwindle {
  # pseudotile = true
}

$mainMod = SUPER
$terminal = kitty
$fileManager = thunar
$menu = rofi -show drun
$browser = firefox

bind = $mainMod, Z, exec, kitty
bind = $mainMod, X, killactive
bind = $mainMod, M, exit
bind = $mainMod, E, exec, thunar
bind = $mainMod, R, exec, rofi -show drun
bind = $mainMod, C, exec, $browser
bind = SUPER, F, fullscreen, 0
bind = $mainMod, V, togglefloating
bind = $mainMod, Q, pin

bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5

bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

blurls = waybar

# HyprMod managed settings
source = /home/LONIK/.config/hypr/hyprland-gui.conf

windowrule = float on, match:class net.bottles.bottles
windowrule = float on, match:class wine
windowrule = fullscreen 1, match:class wine
windowrule = fullscreen 1, match:class steam_app

